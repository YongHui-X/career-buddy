<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover Letter - {{NAME}}</title>
<style>
  @page { margin: 0.65in; }
  * { box-sizing: border-box; font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0, "dlig" 0; }
  body { margin: 0; background: #fff; color: #000; font-family: Arial, Helvetica, sans-serif; font-size: 10.5pt; line-height: 1.48; }
  .name { font-size: 15pt; font-weight: 700; margin-bottom: 3pt; }
  .contact, .credentials, .dateline { color: #000; font-size: 9pt; line-height: 1.35; }
  .contact a, .credentials a { color: #000; text-decoration: none; }
  .credentials { margin-top: 2pt; }
  .divider { border: 0; border-top: 1pt solid #000; margin: 8pt 0 10pt; }
  .role-title { font-size: 11.5pt; font-weight: 700; margin-bottom: 2pt; }
  .dateline { margin-bottom: 14pt; }
  .greeting, p { margin: 0 0 9pt; }
  .achievements { list-style: disc; margin: 0 0 9pt 18pt; padding: 0; }
  .achievements li { margin: 0 0 5pt; padding-left: 2pt; }
  .signature { margin-top: 14pt; }
  .language-closing { font-style: italic; }
  .footnotes { display: none; }
</style>
</head>
<body>
  <div class="name">{{NAME}}</div>
  <div class="contact">{{CONTACT_LINE}}</div>
  {{CREDENTIALS_BLOCK}}
  <hr class="divider">
  <div class="role-title">Cover Letter: {{ROLE_TITLE}}</div>
  <div class="dateline">{{DATELINE}}</div>
  {{GREETING_BLOCK}}
  <p>{{OPENING}}</p>
  <p>{{PROFILE_INTRO}}</p>
  {{ACHIEVEMENTS_BLOCK}}
  {{PROBLEMS_BLOCK}}
  {{CLOSING_BLOCK}}
  {{LANGUAGE_CLOSING_BLOCK}}
  {{SIGNATURE_BLOCK}}
  {{FOOTNOTES_BLOCK}}
</body>
</html>
