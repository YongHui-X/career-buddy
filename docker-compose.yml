services:
  career-ops:
    build:
      context: .
      dockerfile: Dockerfile
    image: career-ops:local
    container_name: career-ops
    working_dir: /app
    # Long-running shell so `docker compose exec` is instant.
    command: ["tail", "-f", "/dev/null"]
    init: true
    # Mount whole project so edits on host are visible inside the container.
    # node_modules is kept inside the image to avoid host/container ABI mismatch
    # (host is ubuntu26.04 where playwright won't install; image is Noble).
    volumes:
      - .:/app
      - career-ops-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      # Forward common API keys if set on host. Empty values are ignored.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CAREER_OPS_MODEL=${CAREER_OPS_MODEL:-}
    # Chromium needs a larger /dev/shm than the default 64M.
    shm_size: "1gb"
    # Dashboard TUI is interactive; expose nothing by default but allow `-it`.
    tty: true
    stdin_open: true
    restart: unless-stopped

  dashboard:
    image: career-ops:local
    container_name: career-ops-dashboard
    working_dir: /app
    command: ["sh", "/app/automation/start-dashboard.sh"]
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./output:/app/output
      - ./config/profile.yml:/app/config/profile.yml
      - ./cv.md:/app/cv.md
      - ./portals.yml:/app/portals.yml
      - ./article-digest.md:/app/article-digest.md
      - ./modes/_profile.md:/app/modes/_profile.md
      - ./modes/_custom.md:/app/modes/_custom.md
    environment:
      - NODE_ENV=production
      - CAREER_OPS_APPLY_API_DISABLED=true
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: "1g"
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  apply-browser:
    image: career-ops:local
    container_name: career-ops-apply-browser
    working_dir: /app
    command: ["sh", "/app/automation/start-web.sh"]
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    volumes:
      - ./data/browser-artifacts:/app/output:ro
      - ./data/automation-screenshots:/app/data/automation-screenshots
      - ./data/browser-profile:/browser-profile
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /app/web/.next/cache:size=128m,mode=1777
    environment:
      - NODE_ENV=production
      - DISPLAY=:99
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - CAREER_OPS_BROWSER_PROFILE_DIR=/browser-profile
      - CAREER_OPS_BROWSER_HEADLESS=false
    ports:
      - "127.0.0.1:6080:6080"
    secrets: [novnc_password]
    shm_size: "1gb"
    mem_limit: "3g"
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
      - seccomp=./automation/seccomp_profile.json
    restart: unless-stopped

  automation-worker:
    image: career-ops:local
    container_name: career-ops-automation
    working_dir: /app
    command: ["node", "automation/scheduler.mjs"]
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on: [apply-browser]
    volumes:
      - .:/app
      - career-ops-node-modules:/app/node_modules
    environment:
      - NODE_ENV=production
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - CAREER_OPS_APPLY_URL=http://apply-browser:3000
      - CAREER_OPS_HANDOFF_URL=${CAREER_OPS_HANDOFF_URL:-}
      - OPENROUTER_API_KEY_FILE=/run/secrets/openrouter_api_key
      - CAREER_OPS_MODEL_FILE=/run/secrets/openrouter_model
      - TELEGRAM_BOT_TOKEN_FILE=/run/secrets/telegram_bot_token
      - TELEGRAM_CHAT_ID_FILE=/run/secrets/telegram_chat_id
    secrets: [openrouter_api_key, openrouter_model, telegram_bot_token, telegram_chat_id]
    mem_limit: "2g"
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  career-ops-node-modules:

secrets:
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt
  openrouter_model:
    file: ./secrets/openrouter_model.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  telegram_chat_id:
    file: ./secrets/telegram_chat_id.txt
  novnc_password:
    file: ./secrets/novnc_password.txt
